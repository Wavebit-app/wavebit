[package]
name = "wavebit-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
walkdir = "2"
lofty = "0.25"
ebur128 = "0.1"
# 0.5: the decoding API this module is written against (0.6 reworked it).
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "flac",
  "aac",
  "isomp4",
  "ogg",
  "vorbis",
  "wav",
  "pcm",
] }
tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
  "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
